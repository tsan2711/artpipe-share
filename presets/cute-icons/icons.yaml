# Danh sách icon cần sinh. Mỗi dòng một icon:
#   name     tên icon → tên file kebab-case (vd "Gold Coin" → gold-coin.png)
#   prompt   mô tả HÌNH bằng tiếng Anh, ngắn, một chủ thể (đừng tả nền, đừng tả phong cách — preset lo)
#   element  khoá màu trong art-direction.md (gold/red/blue/green/purple/pink) — tuỳ chọn
#   subtype  (thay cho prompt) khoá trong subtype_shape của art-direction.md
#
# Mẹo: "one ..." / "a single ..." giúp AI vẽ đúng MỘT vật. Tả hình khối + 1–2 chi tiết nhận diện là đủ.

icons:
  # ── Tiền tệ / tài nguyên ──
  - { name: Gold Coin,     subtype: coin, element: gold }
  - { name: Gem,           subtype: gem,  element: purple }
  - { name: Energy,        prompt: "one yellow lightning bolt inside a round glowing orb", element: blue }
  - { name: Heart,         prompt: "one big red heart symbol, plump and glossy", element: red }

  # ── Item ──
  - { name: Potion,        prompt: "one round glass potion flask with a cork, glowing liquid inside", element: pink }
  - { name: Sword,         prompt: "one short sword pointing up, silver blade, gold cross guard, brown leather grip", element: gold }
  - { name: Shield,        prompt: "one round knight shield with a metal rim and a gold star emblem", element: blue }
  - { name: Treasure Chest, prompt: "one small treasure chest slightly open with light glowing out", element: gold }
  - { name: Key,           prompt: "one ornate golden key with a round bow and square teeth", element: gold }

  # ── UI ──
  - { name: Settings,      prompt: "one mechanical cog gear wheel with square teeth and a round hole in the middle", element: blue }
  - { name: Star,          prompt: "one chubby five pointed star, glossy", element: gold }
  - { name: Gift,          prompt: "one gift box with a big ribbon bow on top", element: pink }
